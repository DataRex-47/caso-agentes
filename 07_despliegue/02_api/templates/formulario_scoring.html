<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Simulador de Scoring – Contratación de Fondos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f6f6f6;
        }

        h1 {
            margin-bottom: 10px;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 6px;
            max-width: 900px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        label {
            font-weight: bold;
            margin-bottom: 4px;
        }

        input,
        select {
            padding: 6px;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        pre {
            background: #222;
            color: #0f0;
            padding: 15px;
            margin-top: 20px;
            border-radius: 6px;
            min-height: 80px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Simulador de Scoring – API de Contratación</h1>
    <p>Formulario interno para pruebas de la API (uso didáctico).</p>

    <form id="scoringForm">

        <div class="campo">
            <label>Registro ID</label>
            <input type="number" id="registro_id" value="0">
        </div>

        <div class="campo">
            <label>Edad</label>
            <input type="number" id="edad" step="1" min="0" value="44">
        </div>

        <div class="campo">
            <label>Trabajo</label>
            <select id="trabajo">
                <option>blue-collar</option>
                <option>technician</option>
                <option>management</option>
                <option>services</option>
                <option>admin.</option>
                <option>retired</option>
                <option>unemployed</option>
                <option>entrepreneur</option>
                <option>self-employed</option>
                <option>housemaid</option>
                <option>unknown</option>
            </select>
        </div>

        <div class="campo">
            <label>Estado Civil</label>
            <select id="estado_civil">
                <option>married</option>
                <option>single</option>
                <option>divorced</option>
            </select>
        </div>

        <div class="campo">
            <label>Formación</label>
            <select id="formacion">
                <option value="">(null)</option>
                <option>basic.4y</option>
                <option>basic.6y</option>
                <option>basic.9y</option>
                <option>high.school</option>
                <option>professional.course</option>
                <option>university.degree</option>
                <option>unknown</option>
            </select>
        </div>

        <div class="campo">
            <label>Impago</label>
            <select id="impago">
                <option>no</option>
                <option>yes</option>
                <option>unknown</option>
            </select>
        </div>

        <div class="campo">
            <label>Préstamo hipotecario</label>
            <select id="hipotecario">
                <option>no</option>
                <option>yes</option>
                <option>unknown</option>
            </select>
        </div>

        <div class="campo">
            <label>Préstamo personal</label>
            <select id="personal">
                <option>no</option>
                <option>yes</option>
                <option>unknown</option>
            </select>
        </div>

        <div class="campo">
            <label>Canal de contacto</label>
            <select id="canal">
                <option>cellular</option>
                <option>telephone</option>
            </select>
        </div>

        <div class="campo">
            <label>Mes</label>
            <select id="mes">
                <option>jan</option>
                <option>feb</option>
                <option>mar</option>
                <option>apr</option>
                <option>may</option>
                <option>jun</option>
                <option>jul</option>
                <option>aug</option>
                <option>sep</option>
                <option>oct</option>
                <option>nov</option>
                <option>dec</option>
            </select>
        </div>

        <div class="campo">
            <label>Día de la semana</label>
            <select id="dia">
                <option value="">(null)</option>
                <option>mon</option>
                <option>tue</option>
                <option>wed</option>
                <option>thu</option>
                <option>fri</option>
            </select>
        </div>

        <div class="campo">
            <label>Nº contactos esta campaña</label>
            <input type="number" id="contactos_campana" step="1" value="1">
        </div>

        <div class="campo">
            <label>Días desde último contacto</label>
            <input type="number" id="pdays" step="1" value="999">
        </div>

        <div class="campo">
            <label>Nº contactos otras campañas</label>
            <input type="number" id="contactos_previos" step="1" value="0">
        </div>

        <div class="campo">
            <label>Resultado campaña anterior</label>
            <select id="resultado_campana_anterior">
                <option value="">(null)</option>
                <option value="nonexistent">nonexistent</option>
                <option value="failure">failure</option>
                <option value="success">success</option>
            </select>
        </div>

        <div class="campo">
            <label>Variación tasa empleo (escala modelo)</label>
            <input type="number" id="empleo" step="1" value="14">
        </div>

        <div class="campo">
            <label>Euribor 3m (escala modelo)</label>
            <input type="number" id="euribor" step="1" value="4963">
        </div>

        <button type="submit">Enviar a la API</button>

    </form>

    <pre id="resultado_box">Resultado del scoring aparecerá aquí…</pre>

    <script>
        const API_URL = "/predict";
        const resultadoBox = document.getElementById("resultado_box");

        document.getElementById("scoringForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            resultadoBox.textContent = "Calculando scoring...";

            const payload = {
                "Unnamed: 0": Number(document.getElementById("registro_id").value),
                "Edad": document.getElementById("edad").value === "" ? null : parseInt(document.getElementById("edad").value, 10),
                "Trabajo": document.getElementById("trabajo").value || null,
                "Estado Civil": document.getElementById("estado_civil").value || null,
                "Fomación": document.getElementById("formacion").value || null,
                "Impago": document.getElementById("impago").value || null,
                "Prestamo hipotecario": document.getElementById("hipotecario").value || null,
                "Prestamo Personal": document.getElementById("personal").value || null,
                "Canal de contacto": document.getElementById("canal").value || null,
                "Mes": document.getElementById("mes").value || null,
                "Dia de la semana": document.getElementById("dia").value || null,
                "num contactos esta campaña": document.getElementById("contactos_campana").value === "" ? null : Number(document.getElementById("contactos_campana").value),
                "num días último contacto": document.getElementById("pdays").value === "" ? null : Number(document.getElementById("pdays").value),
                "num contactos otras campañas": document.getElementById("contactos_previos").value === "" ? null : Number(document.getElementById("contactos_previos").value),
                "resultado campaña anterior": document.getElementById("resultado_campana_anterior").value || null,
                "variación tasa empleo": Number(document.getElementById("empleo").value),
                "euribor3m": Number(document.getElementById("euribor").value)
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { raw_response: text };
                }

                if (!response.ok) {
                    resultadoBox.textContent = "ERROR " + response.status + "\n" + JSON.stringify(data, null, 2);
                    return;
                }

                resultadoBox.textContent = JSON.stringify(data, null, 2);

            } catch (err) {
                resultadoBox.textContent = "ERROR JS: " + err;
            }
        });
    </script>

</body>

</html>
